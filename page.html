<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Store Information</title><link rel="stylesheet" href="/style.css"></head><body><div class="top"><a href="/">← Royal Mobile And Printing Store</a></div><main><article class="admin-card"><h1 id="title">Loading…</h1><div id="body"></div></article></main><script>const slug=new URLSearchParams(location.search).get('slug');fetch('/api/pages/'+encodeURIComponent(slug||'about')).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);document.title=d.title+' · Royal Store';document.getElementById('title').textContent=d.title;document.getElementById('body').textContent=d.body}).catch(e=>{document.getElementById('title').textContent='Page unavailable';document.getElementById('body').textContent=e.message})</script></body></html>
