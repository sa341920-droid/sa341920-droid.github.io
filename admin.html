<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/style.css"></head><body><div class="top">Royal Marketplace Admin <span><a href="/">Storefront</a></span></div><main><h1>Admin access</h1><p>Sign in with an account whose database role is ADMIN. Do not grant admin role to public users.</p><button id="summary">Load dashboard summary</button><pre id="out"></pre><button id="orders">View orders</button><pre id="olist"></pre></main><script>async function call(p){let r=await fetch('/api'+p,{headers:{Authorization:'Bearer '+localStorage.getItem('rm_token')}});let d=await r.json();if(!r.ok)throw Error(d.error);return d}document.getElementById('summary').onclick=async()=>{try{document.getElementById('out').textContent=JSON.stringify(await call('/admin/summary'),null,2)}catch(e){alert(e.message)}};document.getElementById('orders').onclick=async()=>{try{document.getElementById('olist').textContent=JSON.stringify(await call('/admin/orders'),null,2)}catch(e){alert(e.message)}}</script></body></html>
