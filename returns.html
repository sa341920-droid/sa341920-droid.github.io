<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Returns</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="top">Returns & Refunds <b><a href="index.html">Storefront</a></b></div><main class="admin"><h1>Return / refund request</h1><div class="panel"><form id="f"><div class="field"><label>Order ID</label><input name="order" required placeholder="RM12345678"></div><div class="field"><label>Reason</label><select name="reason"><option>Damaged item</option><option>Wrong item</option><option>Not as described</option><option>Other</option></select></div><div class="field"><label>Details</label><textarea name="details"></textarea></div><button>Submit request</button></form><h2>Saved requests</h2><div id="list"></div></div></main><script>let k='royalReturnsV2',a=JSON.parse(localStorage.getItem(k)||'[]');function draw(){document.getElementById('list').innerHTML=a.map(x=>`<p>${x.order} · ${x.reason} · Submitted</p>`).join('')||'None yet'}document.getElementById('f').onsubmit=e=>{e.preventDefault();a.unshift(Object.fromEntries(new FormData(e.target)));localStorage.setItem(k,JSON.stringify(a));e.target.reset();draw();alert('Request saved in browser demo')};draw()</script></body></html>
