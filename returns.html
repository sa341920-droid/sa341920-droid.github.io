<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Returns & Refunds | Royal Marketplace</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div class="topline">CUSTOMER CARE</div><header class="header"><a class="brand" href="index.html"><span class="brandmark">R</span><span>Royal<span class="gold">Market</span><small>RETURNS & REFUNDS</small></span></a><a class="primary" href="index.html">Continue shopping</a></header><main class="section"><div class="eyebrow">ORDER SUPPORT</div><h2>Returns, refunds & exchanges</h2><p>Submit a return or refund request for an order. In this demo, the request is stored in this browser only.</p><form id="returnForm" class="formgrid"><input required name="order" placeholder="Order number"><input required name="email" type="email" placeholder="Email used for order"><select name="reason"><option>Damaged item</option><option>Wrong item received</option><option>Item not as described</option><option>Changed my mind</option><option>Other</option></select><select name="resolution"><option>Refund</option><option>Replacement</option><option>Exchange</option></select><textarea name="details" placeholder="Describe the issue"></textarea><button class="primary">Submit request</button></form><div id="returnResult"></div></main><script>document.getElementById('returnForm').onsubmit=e=>{e.preventDefault();let a=JSON.parse(localStorage.getItem('royal_returns')||'[]');a.push({...Object.fromEntries(new FormData(e.target)),submittedAt:new Date().toISOString(),status:'Submitted'});localStorage.setItem('royal_returns',JSON.stringify(a));document.getElementById('returnResult').innerHTML='<p class="notice">Request submitted in this browser demo. A live return workflow needs server-side order verification and customer notifications.</p>';e.target.reset()}</script></body></html>
