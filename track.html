<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order · Royal Store</title><link rel="stylesheet" href="/style.css"></head><body><div class="top">Track order <span><a href="/">Store</a></span></div><main><h1>Track your order</h1><section class="admin-card"><form id="track"><div class="field"><label>Order number</label><input name="orderNumber" placeholder="RM…" required></div><button>Track order</button></form><pre id="tracking"></pre></section><section class="admin-card"><h2>My order history</h2><button id="load">Load my order history</button><pre id="out"></pre></section></main><script>document.getElementById('track').onsubmit=async e=>{e.preventDefault();const n=new FormData(e.target).get('orderNumber');try{const r=await fetch('/api/track/'+encodeURIComponent(n)),d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('tracking').textContent=JSON.stringify(d,null,2)}catch(x){document.getElementById('tracking').textContent=x.message}};document.getElementById('load').onclick=async()=>{let r=await fetch('/api/orders',{headers:{Authorization:'Bearer '+localStorage.getItem('rm_token')}}),d=await r.json();document.getElementById('out').textContent=r.ok?JSON.stringify(d,null,2):d.error}</script></body></html>
