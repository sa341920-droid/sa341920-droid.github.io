<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Orders</title><link rel="stylesheet" href="/style.css"></head><body><div class="top">Track order <span><a href="/">Store</a></span></div><main><h1>Your orders</h1><button id="load">Load my order history</button><pre id="out"></pre></main><script>document.getElementById('load').onclick=async()=>{let r=await fetch('/api/orders',{headers:{Authorization:'Bearer '+localStorage.getItem('rm_token')}}),d=await r.json();document.getElementById('out').textContent=r.ok?JSON.stringify(d,null,2):d.error}</script></body></html>
