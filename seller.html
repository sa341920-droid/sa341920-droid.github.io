<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Center</title><link rel="stylesheet" href="/style.css"></head><body><div class="top">Royal Marketplace Seller Center <span><a href="/">Store</a></span></div><main><h1>Seller application</h1><p>Login first, then submit your store details. Admin approval is required before product publishing.</p><form id="f" class="modal"><div class="field"><label>Store name</label><input name="storeName" required></div><div class="field"><label>Store address</label><textarea name="address"></textarea></div><button>Apply</button></form><p id="out"></p></main><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();let t=localStorage.getItem('rm_token');if(!t)return alert('Login on store first');let f=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/seller/apply',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(f)});let d=await r.json();document.getElementById('out').textContent=r.ok?'Application status: '+d.status:d.error}</script></body></html>
