<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order | Royal Marketplace</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div class="topline">ORDER TRACKING</div><header class="header"><a class="brand" href="index.html"><span class="brandmark">R</span><span>Royal<span class="gold">Market</span><small>TRACK YOUR ORDER</small></span></a><a class="primary" href="index.html">Store</a></header><main class="section"><div class="eyebrow">WHERE IS MY ORDER?</div><h2>Track your order</h2><p>Enter an order number saved in this browser's demo checkout.</p><form id="trackForm"><input class="wideinput" name="id" required placeholder="Example: RM1234567"><button class="primary">Track order</button></form><div id="trackResult"></div></main><script>document.getElementById('trackForm').onsubmit=e=>{e.preventDefault();let id=new FormData(e.target).get('id');let orders=JSON.parse(localStorage.getItem('royal_orders')||'[]');let o=orders.find(x=>x.id.toLowerCase()===id.toLowerCase());document.getElementById('trackResult').innerHTML=o?`<div class="stat" style="margin-top:20px"><small>Order ${o.id}</small><b>${o.status}</b><p>${o.date} · ${o.items.length} item type(s) · Rs. ${Number(o.total).toLocaleString()}</p></div>`:'<p class="notice">Order not found in this browser. Live tracking requires a backend and courier integration.</p>'}</script></body></html>
