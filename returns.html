<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Returns</title><link rel="stylesheet" href="/style.css"></head><body><div class="top">Returns & refunds <span><a href="/">Store</a></span></div><main><h1>Return request</h1><p>Order UUID is required. Authenticate with a customer token in the browser.</p><form id="f" class="modal"><div class="field"><label>Order UUID</label><input name="orderId" required></div><div class="field"><label>Reason</label><textarea name="reason" required minlength="5"></textarea></div><button>Submit return</button></form><p id="out"></p></main><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),r=await fetch('/api/returns',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('rm_token')},body:JSON.stringify(d)}),x=await r.json();document.getElementById('out').textContent=r.ok?'Request created':x.error}</script></body></html>
