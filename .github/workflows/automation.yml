name: Automation Engine
on:
  schedule: [{ cron: '0 8 * * *' }, { cron: '0 18 * * *' }]
  workflow_dispatch:
    inputs:
      job: { description: 'Job', required: true, default: 'low-stock' }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
      - run: node automation.js "${{ inputs.job || 'low-stock' }}"
