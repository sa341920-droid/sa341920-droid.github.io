services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: royal_marketplace
      POSTGRES_USER: royal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in environment}
    volumes:
      - royal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U royal -d royal_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  royal_pg:
