<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Center</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="top">Seller Center <b><a href="index.html">Storefront</a></b></div><main class="admin"><h1>Seller product request</h1><p>Submit a listing request for this local browser demo.</p><div class="panel"><form id="f"><div class="field"><label>Shop name</label><input name="seller" required></div><div class="field"><label>Product name</label><input name="name" required></div><div class="field"><label>Category</label><input name="category" required></div><div class="field"><label>Price PKR</label><input name="price" type="number" required min="1"></div><div class="field"><label>Details</label><textarea name="details"></textarea></div><button>Submit listing</button></form><h2>Requests</h2><div id="list"></div></div></main><script>let k='royalSellerV2',a=JSON.parse(localStorage.getItem(k)||'[]');function draw(){document.getElementById('list').innerHTML=a.map(x=>`<p><b>${x.name}</b> · ${x.seller} · Rs. ${x.price} <span>Pending</span></p>`).join('')||'No requests yet'}document.getElementById('f').onsubmit=e=>{e.preventDefault();a.unshift(Object.fromEntries(new FormData(e.target)));localStorage.setItem(k,JSON.stringify(a));e.target.reset();draw();alert('Saved as demo listing request')};draw()</script></body></html>
