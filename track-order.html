<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="top">Track Order <b><a href="index.html">Storefront</a></b></div><main class="admin"><h1>Track your order</h1><div class="panel"><form id="f"><div class="field"><label>Order ID</label><input name="id" required></div><button>Track</button></form><div id="result"></div></div></main><script>let db=JSON.parse(localStorage.getItem('royalMarketV2')||'{}');document.getElementById('f').onsubmit=e=>{e.preventDefault();let id=new FormData(e.target).get('id'),o=(db.orders||[]).find(x=>x.id===id);document.getElementById('result').innerHTML=o?`<h2>${o.id}</h2><p>Status: <b>${o.status}</b></p><p>Total Rs. ${o.total}</p><p>${o.address}</p>`:'Order not found in this browser. Orders are local demo records.'}</script></body></html>
